    <script>
      (function() {
        try {
          var mode = localStorage.getItem('superpay_theme_mode_v1') || 'system';
          var isDark = mode === 'dark' || (mode === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#0b0c10] text-[#14141a] antialiased select-none overflow-x-hidden">

    <script type="module" src="/src/main.tsx"></script>
  </body>
